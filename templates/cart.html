<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h2>Your Cart</h2>

    {% for item in cart %}
        <p>{{ item.product }} - ${{ item.price }}</p>
        <p>Name: {{ item.name }}</p>
        <p>Message: {{ item.message }}</p>
        <hr>
    {% endfor %}

    <h3>Total: ₹{{ total }}</h3>

    <a href="/order">Place Order</a>
</body>
</html>
