<!DOCTYPE html>
<html>
<head>
    <title>Customize Your Gift</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="form-container">

    <h2>Customize Your Gift 🎁</h2>

    <form action="{{ url_for('order') }}" method="POST">

        <input type="text" name="name" placeholder="Your Name" required>

        <input type="text" name="product" placeholder="Product Name" required>

        <textarea name="message" placeholder="Custom Message"></textarea>

        <input type="text" name="photo_link" placeholder="Paste Photo Link (for personalization)">

        <button type="submit" class="btn">Place Order</button>

    </form>

</div>

</body>
</html>
