<!DOCTYPE html>
<html>
<head>
    <title>Customize - The Gifting Edit</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<!-- Navbar -->
<div class="navbar">
    <h2>The Gifting Edit 🎁</h2>
    <a href="/">Home</a>
    <a href="/products">Shop</a>
    <a href="/customize">Customize</a>
</div>

<!-- Heading -->
<h1 class="heading">Create Your Own Gift 🎀</h1>

<!-- Form Section -->
<div class="customize-container">

    <form class="custom-form">

        <label>Choose Gift Type</label>
        <select>
            <option>Chocolate Bouquet 🍫</option>
            <option>Hair Clutcher Bouquet 🎀</option>
            <option>DIY Gift Box 🎁</option>
            <option>Custom Bracelet 💎</option>
            <option>Crochet Bouquet 🌸</option>
        </select>

        <label>Enter Name / Text for Customization</label>
        <input type="text" placeholder="Enter name or message">

        <label>Choose Theme</label>
        <select>
            <option>Birthday 🎂</option>
            <option>Anniversary ❤️</option>
            <option>Festive ✨</option>
            <option>Minimal Aesthetic 🤍</option>
        </select>

        <label>Additional Instructions</label>
        <textarea placeholder="Write your customization details..."></textarea>

        <button type="submit">Place Custom Order 💝</button>

    </form>

</div>

</body>
</html>
