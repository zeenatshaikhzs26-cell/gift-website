<!DOCTYPE html>
<html>
<head>
    <title>Shop - The Gifting Edit</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <h2>The Gifting Edit 🎁</h2>
    <a href="/">Home</a>
</div>

<h2 style="text-align:center; color:#ff4081;">✨ Our Products ✨</h2>

<div class="container">

{% for product in products %}
    <div class="card">
        <img src="{{ product.image }}" alt="gift">

        <h3>{{ product.name }}</h3>
        <p class="price">₹ {{ product.price }}</p>

        <a href="/customize/{{ product.id }}" class="btn">
            Customize
        </a>
    </div>
{% endfor %}

</div>

</body>
</html>
